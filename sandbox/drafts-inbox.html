<!DOCTYPE html>
<html lang="en" class="bg-[#000000]">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport ensures correct scaling and prevents zoom on mobile forms -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drafts Inbox - Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        bg: '#000000',
                        surface: '#111111',
                        'surface-raised': '#1C1C1E',
                        border: '#2C2C2E',
                        'text-primary': '#FFFFFF',
                        'text-secondary': '#8E8E93',
                        'text-tertiary': '#48484A',
                        accent: '#8E8E93' // Default graphite
                    },
                    spacing: {
                        xs: '4px',
                        sm: '8px',
                        md: '16px',
                        lg: '24px',
                        xl: '32px'
                    },
                    borderRadius: {
                        sm: '8px',
                        md: '12px',
                        lg: '16px'
                    }
                }
            }
        }
    </script>
    <style>
        /* Impeccable motion & interaction defaults */
        body {
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh bounce */
        }
        
        /* Active states simulating haptic/touch feedback */
        .touch-active:active {
            transform: scale(0.96);
            opacity: 0.8;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.1s;
        }

        .transition-spring {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Hidden scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden selection:bg-white/20">

    <!-- Top App Bar -->
    <header class="flex items-center justify-between px-md py-md bg-bg/80 backdrop-blur-xl border-b border-border z-40">
        <button aria-label="Menu" class="w-11 h-11 flex items-center justify-center rounded-full touch-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
            <span class="material-symbols-outlined text-[24px]">menu</span>
        </button>
        <h1 class="text-[22px] font-bold tracking-tight">Drafts</h1>
        <button aria-label="More options" class="w-11 h-11 flex items-center justify-center rounded-full touch-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
            <span class="material-symbols-outlined text-[24px]">more_vert</span>
        </button>
    </header>

    <!-- Main Content (Scrollable) -->
    <main class="flex-1 overflow-y-auto px-md py-lg pb-[120px]">
        
        <div class="mb-lg">
            <p class="text-[15px] text-text-secondary leading-snug">
                Review and confirm AI-extracted deadlines before they hit your calendar.
            </p>
        </div>

        <ul class="space-y-md" role="list" aria-label="Pending drafts">
            
            <!-- High Confidence Draft -->
            <li class="bg-surface rounded-md border border-border p-md flex flex-col gap-md transition-spring">
                <div class="flex items-start justify-between gap-sm">
                    <div class="flex items-start gap-sm flex-1">
                        <!-- High Confidence Dot (100% Opacity) -->
                        <div aria-hidden="true" class="w-2 h-2 rounded-full bg-text-primary mt-1.5 flex-shrink-0"></div>
                        <div>
                            <h3 class="text-[17px] font-medium leading-tight">CS101 Final Project</h3>
                            <div class="flex items-center gap-2 mt-xs text-[13px] text-text-secondary">
                                <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                                <span>Oct 24, 11:59 PM</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Control Bar -->
                <div class="flex items-center justify-end gap-sm pt-sm border-t border-border">
                    <button class="px-md py-sm rounded-full text-[15px] text-text-secondary font-medium touch-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                        Dismiss
                    </button>
                    <!-- Accent button (Graphite by default) -->
                    <button class="bg-surface-raised px-lg py-sm rounded-full text-[15px] font-medium touch-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white border border-border flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">check</span>
                        Confirm
                    </button>
                </div>
            </li>

            <!-- Low Confidence Draft -->
            <li class="bg-surface rounded-md border border-border p-md flex flex-col gap-md transition-spring">
                <div class="flex items-start justify-between gap-sm">
                    <div class="flex items-start gap-sm flex-1">
                        <!-- Low Confidence Dot (Hollow ring) -->
                        <div aria-hidden="true" class="w-2 h-2 rounded-full border border-text-tertiary mt-1.5 flex-shrink-0"></div>
                        <div>
                            <h3 class="text-[17px] font-medium leading-tight">Math Homework 4</h3>
                            <div class="flex items-center gap-2 mt-xs text-[13px] text-text-secondary">
                                <span class="material-symbols-outlined text-[14px]">help</span>
                                <span>Couldn't find a date</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Control Bar -->
                <div class="flex items-center justify-end gap-sm pt-sm border-t border-border">
                    <button class="px-md py-sm rounded-full text-[15px] text-text-secondary font-medium touch-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                        Dismiss
                    </button>
                    <button class="bg-surface-raised px-lg py-sm rounded-full text-[15px] font-medium touch-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white border border-border flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">edit</span>
                        Add Date
                    </button>
                </div>
            </li>
            
        </ul>
    </main>

    <!-- Contextual Bottom Nav -->
    <nav class="absolute bottom-0 w-full h-[88px] bg-bg/90 backdrop-blur-2xl border-t border-border px-md pb-md pt-sm flex justify-around items-center z-50">
        
        <!-- Standard Nav Items -->
        <a href="#" class="flex flex-col items-center justify-center text-text-secondary hover:text-text-primary transition-colors w-16 touch-active focus-visible:outline-none">
            <span class="material-symbols-outlined text-[24px] mb-1">calendar_today</span>
            <span class="text-[11px] font-medium">Timeline</span>
        </a>

        <!-- Contextual Action (Replaces the generic '+' or FAB) -->
        <button class="flex items-center justify-center gap-2 bg-text-primary text-bg rounded-full px-6 py-3 font-semibold text-[15px] touch-active focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-surface-raised shadow-lg">
            Confirm All (2)
        </button>

        <!-- Standard Nav Items -->
        <a href="#" class="flex flex-col items-center justify-center text-text-secondary hover:text-text-primary transition-colors w-16 touch-active focus-visible:outline-none">
            <span class="material-symbols-outlined text-[24px] mb-1">settings</span>
            <span class="text-[11px] font-medium">Settings</span>
        </a>

    </nav>

    <script>
        // Simple haptic emulation for testing on mobile browsers
        document.querySelectorAll('.touch-active').forEach(el => {
            el.addEventListener('touchstart', () => {
                if (navigator.vibrate) navigator.vibrate(10); // Light tap
            }, {passive: true});
        });
    </script>
</body>
</html>
